# TrustBazaar web container (Unit 8 reference): serves the four documents with their own headers,
# and forwards the API and the live connection to the backend, so browser and API share one origin.
# BACKEND is replaced at start (docker: backend:3000). TLS and HSTS are added by the TLS front (Unit 9).

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen       8080;
  server_name  _;
  root         /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;
  client_max_body_size 12m;          # CP-33 images (10 MB) plus form overhead

  # ---------------------------------------------------------------- API and live connection
  location /api/ {
    proxy_pass         http://BACKEND;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Origin            $http_origin;        # Unit 1's CsrfGuard checks it
    proxy_read_timeout 60s;
  }
  location /socket.io/ {
    proxy_pass         http://BACKEND;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_set_header   Host       $host;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;                                  # longer than Socket.IO's ping interval
  }

  # ---------------------------------------------------------------- health check for Compose (Unit 9)
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # ---------------------------------------------------------------- hashed build output
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cross-Origin-Resource-Policy same-origin always;
  }

  # ---------------------------------------------------------------- the four documents
  # (add_header in a location replaces the parent's, so each document lists all of its headers)

  # staff console (FR-OPS, SEC-SES-06): no camera, no location, never cached
  location /staff/ { try_files /staff.html =404; include /etc/nginx/tb/staff-headers.conf; }
  location /admin/ { try_files /staff.html =404; include /etc/nginx/tb/staff-headers.conf; }
  location = /staff.html { include /etc/nginx/tb/staff-headers.conf; }

  # KYC capture: the only document allowed the camera (SEC-WEB-02, FR-KYC-02)
  location = /account/kyc  { try_files /kyc.html =404; include /etc/nginx/tb/kyc-headers.conf; }
  location /account/kyc/   { try_files /kyc.html =404; include /etc/nginx/tb/kyc-headers.conf; }
  location = /kyc.html { include /etc/nginx/tb/kyc-headers.conf; }

  # credential pages (SEC-GAM-03): the strictest policy, never stored
  location /secure/ { try_files /secure.html =404; include /etc/nginx/tb/secure-headers.conf; }
  location = /secure.html { include /etc/nginx/tb/secure-headers.conf; }

  # the user app: every other path is a route of index.html
  location = /index.html { include /etc/nginx/tb/app-headers.conf; }
  location / {
    try_files $uri /index.html;
    include /etc/nginx/tb/app-headers.conf;
  }
}
